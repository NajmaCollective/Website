<!doctype html>
<!-- Source for assets/brand/share-card.jpg, the 1200 × 630 preview image that
     WhatsApp, Signal, LinkedIn, Slack and search engines show for shared links.
     Regenerate with: node tools/render_share_card.cjs (needs Playwright). -->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<style>
  @import url("https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,100..110,400..700&display=block");
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; display: grid; grid-template-columns: 700px 500px; background: #203e32; font-family: 'Roboto Flex', system-ui, sans-serif; }
  .copy { display: flex; flex-direction: column; justify-content: center; padding: 0 56px 0 72px; color: #f0f6eb; }
  .copy img { width: 250px; height: auto; margin-bottom: 44px; }
  h1 { margin: 0 0 28px; font-size: 56px; font-weight: 650; font-stretch: 104%; line-height: 1.02; letter-spacing: -.035em; text-wrap: balance; }
  p { display: inline-block; width: fit-content; margin: 0; padding: 12px 24px; border-radius: 999px; background: #c5ebd6; color: #102f23; font-size: 26px; font-weight: 650; letter-spacing: -.01em; }
  .photo { position: relative; margin: 32px 32px 32px 0; border-radius: 48px; overflow: hidden; }
  .photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 60% 50%; }
</style>
</head>
<body>
  <div class="copy">
    <img src="../assets/brand/najma-logo-reverse.svg" alt="">
    <h1>Online English lessons with a teacher of your choice</h1>
    <p>Private lessons: £20 for 55 minutes</p>
  </div>
  <div class="photo"><img src="../assets/stock/web/online-learning/a-lively-online-conversation--j0dCClyasFk-1920.webp" alt=""></div>
</body>
</html>
